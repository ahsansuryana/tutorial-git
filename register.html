<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo" aria-hidden="true">G</div>
                <h1>Buat Akun Baru</h1>
                <p>Isi data berikut untuk mendaftar</p>
            </div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Nama lengkap Anda"
                            autocomplete="name"
                            required>
                    </div>
                    <small class="error-message" id="name-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@example.com"
                            autocomplete="email"
                            required>
                    </div>
                    <small class="error-message" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 6 karakter"
                            autocomplete="new-password"
                            required>
                        <button type="button" class="toggle-password" id="toggle-password"
                            aria-label="Tampilkan password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <small class="strength-label" id="strength-label"></small>
                    <small class="error-message" id="password-error"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Ulangi password"
                            autocomplete="new-password"
                            required>
                        <button type="button" class="toggle-password" id="toggle-confirm"
                            aria-label="Tampilkan konfirmasi password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <small class="error-message" id="confirm-error"></small>
                </div>

                <div class="form-group">
                    <label class="remember terms">
                        <input type="checkbox" id="terms" name="terms">
                        <span>Saya menyetujui <a href="#" class="forgot-link">Syarat &amp; Ketentuan</a></span>
                    </label>
                    <small class="error-message" id="terms-error"></small>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">Daftar</button>

                <div class="alert" id="alert" role="alert" hidden></div>
            </form>

            <p class="login-footer">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </p>
        </div>
    </main>

    <script src="register.js"></script>
</body>
</html>
